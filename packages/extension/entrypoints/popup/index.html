<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadenza</title>
    <link rel="stylesheet" href="../../lib/kit.css" />
    <link rel="stylesheet" href="../../lib/ui.css" />
  </head>
  <body class="popup">
    <header class="popup-head">
      <img class="lockup lockup-light" src="/logo/lockup-on-light.svg" alt="Cadenza" />
      <img class="lockup lockup-dark" src="/logo/lockup-on-dark.svg" alt="Cadenza" />
      <span id="enabled-label" class="muted" aria-hidden="true">On</span>
      <!-- biome-ignore lint/a11y/useAriaPropsForRole: a checkbox reports its own checked state -->
      <input id="enabled" type="checkbox" role="switch" aria-label="Turn Cadenza on or off"
        title="Turn Cadenza on or off" />
    </header>

    <form id="unlock" class="unlock" hidden>
      <p>Enter your passphrase to use your saved API keys.</p>
      <input id="passphrase" type="password" aria-label="Passphrase" autocomplete="current-password" />
      <button type="submit" class="primary">Unlock</button>
      <p id="unlock-message" class="error-text" role="status"></p>
    </form>

    <section id="site-row" class="popup-site" hidden>
      <div>
        <strong id="site-label">Turn off on this site</strong>
        <span id="site-status" class="muted"></span>
      </div>
      <!-- biome-ignore lint/a11y/useAriaPropsForRole: a checkbox reports its own checked state -->
      <input id="site-off" type="checkbox" role="switch" aria-labelledby="site-label"
        aria-describedby="site-status" />
    </section>

    <section id="setup" class="popup-setup" hidden>
      <p>Choose where your writing is checked: a provider with your API key, or a model on this
        computer.</p>
      <button id="set-up" type="button" class="primary">Set up Cadenza</button>
    </section>

    <section id="provider-box" class="popup-provider" hidden>
      <label for="provider">Provider</label>
      <select id="provider"></select>
      <div class="row"><span class="muted">Model</span><code id="model"></code></div>
      <p class="where muted" id="where"></p>
    </section>

    <section class="popup-today">
      <div class="row"><strong>Today</strong><span id="tokens" class="muted"></span></div>
      <div class="meter" id="meter" hidden><div></div></div>
      <p id="checks" class="muted"></p>
    </section>

    <footer class="popup-foot">
      <button id="open-options" type="button" class="link">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 4.5h7M12 4.5h2M2 11.5h2M7 11.5h7" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" />
          <circle cx="10.5" cy="4.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <circle cx="5.5" cy="11.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.6" />
        </svg>
        Settings
      </button>
      <span id="shortcut" class="muted"></span>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
