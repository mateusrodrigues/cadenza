<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cadenza block editor test page</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 24px auto; }
      .page { border: 1px solid #ccc; padding: 12px 16px; }
      /* Like block editors (Notion and others): one small editable per paragraph, no borders. */
      .block { outline: none; padding: 3px 2px; min-height: 1.5em; white-space: pre-wrap; }
      .block:empty::before { content: attr(data-placeholder); color: #aaa; }
    </style>
  </head>
  <body>
    <div class="page" id="page">
      <div class="block" contenteditable="true" data-placeholder="Type here"></div>
    </div>
    <script>
      // Enter starts a new block; Backspace in an empty block removes it.
      const page = document.getElementById('page');
      page.addEventListener('keydown', (e) => {
        const block = e.target.closest('.block');
        if (!block) return;
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const next = document.createElement('div');
          next.className = 'block';
          next.contentEditable = 'true';
          block.after(next);
          next.focus();
        } else if (e.key === 'Backspace' && block.textContent === '' && block.previousElementSibling) {
          e.preventDefault();
          const prev = block.previousElementSibling;
          block.remove();
          prev.focus();
          getSelection().selectAllChildren(prev);
          getSelection().collapseToEnd();
        }
      });
    </script>
  </body>
</html>
